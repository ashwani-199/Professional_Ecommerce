{% extends 'base.html' %}
{% load static %}

{% block title %}Processing Payment - American Owl{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-20 text-center">
    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-12">
        <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6 animate-pulse">
            <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Processing Payment</h1>
        <p class="text-gray-500 mb-2">Please complete your payment in the pop-up window.</p>
        <p class="text-sm text-gray-400">Order #{{ order.id }} &middot; ₹{{ order.total }}</p>
        <button id="pay-now" class="mt-6 bg-primary text-white px-8 py-3 rounded-xl hover:bg-blue-600 transition font-semibold">
            Pay Now
        </button>
    </div>
</div>

<form method="post" action="{% url 'orders:verify_razorpay_payment' %}" id="razorpay-form" class="hidden">
    {% csrf_token %}
    <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
    <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
    <input type="hidden" name="razorpay_signature" id="razorpay_signature">
</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    key: "{{ razorpay_key_id }}",
    amount: "{{ amount }}",
    currency: "{{ currency }}",
    name: "American Owl",
    description: "Order #{{ order.id }}",
    order_id: "{{ razorpay_order_id }}",
    prefill: {
        name: "{{ order.address.full_name }}",
        contact: "{{ order.address.phone }}",
    },
    handler: function (response) {
        document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
        document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
        document.getElementById('razorpay_signature').value = response.razorpay_signature;
        document.getElementById('razorpay-form').submit();
    },
    modal: {
        ondismiss: function() {
            window.location.href = "{% url 'orders:checkout' %}";
        },
        confirm_close: true,
    },
    theme: {
        color: "#3b82f6",
    },
};
var rzp = new Razorpay(options);

document.getElementById('pay-now').addEventListener('click', function (e) {
    rzp.open();
    e.preventDefault();
});

document.addEventListener('DOMContentLoaded', function () {
    rzp.open();
});
</script>
{% endblock %}
